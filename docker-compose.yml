version: "3.8"

services:
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    environment:
      - GATEWAY_PORT=5000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build: ./worker
    ports:
      - "${WORKER_PORT:-5001}:5001"
    environment:
      - WORKER_PORT=5001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT:-5002}:5002"
    environment:
      - DASHBOARD_PORT=5002
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
